<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Central Europe coverage map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #bcd6e6; position: relative; font-family: Manrope, Helvetica, sans-serif; }
  #map { width: 100%; height: 100%; display: block; }
  .country { fill: #e3e6d5; stroke: rgba(90,98,80,.32); stroke-width: .7px; }
  .country.hi { stroke: rgba(50,45,40,.5); stroke-width: 1.1px; cursor: pointer; transition: filter .35s ease; }
  .country.poland { fill: #9fbf87; }
  .country.czechia { fill: #efc879; }
  .country.slovakia { fill: #d9a0ae; }
  .country.hi.on { filter: brightness(1.1) saturate(1.15); }
  .clabel { font-size: 13.5px; font-weight: 800; letter-spacing: .05em; fill: #33352c; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.8); stroke-width: 3.4px; }
  .clabel.dim { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; fill: rgba(95,102,86,.7); stroke-width: 2.6px; }
  .city { fill: #c0392b; stroke: #fff; stroke-width: 1.3px; }
  .cityname { font-size: 10.5px; font-weight: 700; fill: #8c2a20; paint-order: stroke; stroke: rgba(255,255,255,.9); stroke-width: 3px; pointer-events: none; }
  .cap { font-size: 11.5px; font-weight: 800; }
  .city, .cityhit { cursor: pointer; }
  .cityhit { fill: transparent; }
  .city.sel { fill: #012081; stroke-width: 2px; }
  #info { position: absolute; bottom: 16px; width: min(300px, calc(100% - 32px)); background: #fff;
    border-radius: 14px; border: 1px solid #E4EAF2; box-shadow: 0 18px 44px rgba(1,32,129,.22); padding: 16px 18px;
    font-family: Manrope, Helvetica, sans-serif; display: none; }
  #info.on { display: block; animation: pop .26s cubic-bezier(.16,.84,.28,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
  #info .ct { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #0e80df; }
  #info .cy { margin-top: 5px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; color: #012081; }
  #info .rw { margin-top: 9px; font-size: 13.5px; line-height: 1.55; color: #667085; }
  #info .rw b { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #98a2b3; margin-bottom: 2px; }
  #info .sep { margin-top: 12px; padding-top: 11px; border-top: 1px solid #E4EAF2; }
  #info button { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 7px;
    border: 1px solid #E4EAF2; background: #F5F9FF; color: #012081; font-size: 15px; line-height: 1; cursor: pointer; }
  #hint { position: absolute; right: 16px; top: 16px; padding: 8px 13px; border-radius: 9px; background: rgba(255,255,255,.9);
    border: 1px solid #E4EAF2; font-family: Manrope, Helvetica, sans-serif; font-size: 12px; font-weight: 700; color: #012081; }
</style>
</head>
<body>
<svg id="map" role="img" aria-label="Map of Central Europe highlighting Poland, Czechia and Slovakia"></svg>
<div id="hint">Hover a city for office details</div>
<div id="info" role="status" aria-live="polite"></div>
<script>
const NAMES = { Poland: "poland", Czechia: "czechia", "Czech Republic": "czechia", Slovakia: "slovakia" };
const LABELS = { poland: "POLAND", czechia: "CZECHIA", slovakia: "SLOVAKIA" };
const CITIES = {
  poland: [["Warsaw", 21.012, 52.230, 1, "r"], ["Kraków", 19.945, 50.065, 0, "r"], ["Wrocław", 17.038, 51.108, 0, "l"], ["Poznań", 16.925, 52.407, 0, "l"], ["Gdańsk", 18.646, 54.352, 0, "r"], ["Katowice", 19.021, 50.259, 0, "l"]],
  czechia: [["Prague", 14.438, 50.076, 1, "l"], ["Brno", 16.607, 49.195, 0, "l"], ["Ostrava", 18.263, 49.821, 0, "r"], ["Plzeň", 13.378, 49.745, 0, "l"], ["Olomouc", 17.251, 49.594, 0, "d"], ["Liberec", 15.057, 50.767, 0, "u"]],
  slovakia: [["Bratislava", 17.107, 48.148, 1, "d"], ["Košice", 21.258, 48.717, 0, "r"], ["Žilina", 18.740, 49.223, 0, "u"], ["Nitra", 18.087, 48.308, 0, "d"], ["Prešov", 21.242, 48.998, 0, "u"], ["Trnava", 17.588, 48.377, 0, "l"]]
};
const COUNTRY_LABEL = { poland: "Poland", czechia: "Czechia", slovakia: "Slovakia" };
const DIAL = { poland: "+48", czechia: "+420", slovakia: "+421" };
const STREET = {
  poland: ["ul. Przemysłowa 14, 00-000", "ul. Techniczna 8, 30-000", "ul. Serwisowa 22, 50-000", "ul. Sieciowa 5, 60-000", "ul. Portowa 31, 80-000", "ul. Instalacyjna 9, 40-000"],
  czechia: ["Technická 12, 100 00", "Průmyslová 4, 600 00", "Servisní 18, 700 00", "Síťová 7, 300 00", "Instalační 25, 770 00", "Datová 3, 460 00"],
  slovakia: ["Technická 6, 811 00", "Priemyselná 20, 040 00", "Servisná 11, 010 00", "Sieťová 9, 949 00", "Inštalačná 17, 080 00", "Dátová 2, 917 00"]
};
const focus = new URLSearchParams(location.search).get("focus");
const info = document.getElementById("info");
const hint = document.getElementById("hint");
let selected = null;
let pinned = false;

function closeInfo() {
  pinned = false;
  info.classList.remove("on");
  info.innerHTML = "";
  selected = null;
  d3.selectAll("circle.city").classed("sel", false);
}

function showInfo(k, name, idx, node) {
  d3.selectAll("circle.city").classed("sel", false);
  if (node) d3.select(node).classed("sel", true);
  selected = name;
  const street = (STREET[k] || [])[idx] || "Street address — placeholder";
  const phone = DIAL[k] + " 000 000 00" + (idx + 1) + " — placeholder";
  info.innerHTML =
    (pinned ? '<button type="button" aria-label="Close">&times;</button>' : '') +
    '<div class="ct">' + COUNTRY_LABEL[k] + '</div>' +
    '<div class="cy">' + name + '</div>' +
    '<div class="rw"><b>Address</b>' + street + ' ' + name + '</div>' +
    '<div class="rw sep"><b>Phone</b>' + phone + '</div>' +
    '<div class="rw"><b>Email</b>' + name.toLowerCase().replace(/[ąàá]/g, "a").replace(/[ćč]/g, "c").replace(/[ęèé]/g, "e").replace(/[íî]/g, "i").replace(/[ł]/g, "l").replace(/[ńň]/g, "n").replace(/[óòô]/g, "o").replace(/[řŕ]/g, "r").replace(/[śš]/g, "s").replace(/[ťț]/g, "t").replace(/[úůü]/g, "u").replace(/[ýÿ]/g, "y").replace(/[źżž]/g, "z").replace(/[^a-z]/g, "") + '.' + k + '@example.com</div>' +
    '<div class="rw sep" style="font-size:11.5px;color:#98a2b3">Placeholder details — replace with real office data.</div>';
  const mx = node ? node.getBoundingClientRect().left : 0;
  const onLeft = mx < window.innerWidth / 2;
  info.style.left = onLeft ? "auto" : "16px";
  info.style.right = onLeft ? "16px" : "auto";
  info.classList.add("on");
  const btn = info.querySelector("button");
  if (btn) btn.addEventListener("click", closeInfo);
}
const svg = d3.select("#map");

function send(k) { try { parent.postMessage({ type: "map:country", country: k }, "*"); } catch (e) {} }

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  const all = topojson.feature(topo, topo.objects.countries).features;
  const hi = all.filter(f => NAMES[f.properties.name]);
  const neighbours = ["Germany", "Austria", "Hungary", "Ukraine", "Belarus", "Lithuania", "Slovenia", "Croatia", "Denmark", "Sweden", "Romania", "Switzerland", "Netherlands", "Belgium", "Serbia", "Bosnia and Herz.", "Latvia", "Russia", "Moldova", "Italy", "France", "Norway", "Estonia"];

  function draw() {
    const w = window.innerWidth, h = window.innerHeight;
    svg.attr("viewBox", "0 0 " + w + " " + h).selectAll("*").remove();
    const target = focus ? hi.filter(f => NAMES[f.properties.name] === focus) : hi;
    const pad = focus ? 0.06 : 0.14;
    const proj = d3.geoMercator().fitExtent([[w * pad, h * pad], [w * (1 - pad), h * (1 - pad)]], { type: "FeatureCollection", features: target.length ? target : hi });
    const path = d3.geoPath(proj);

    const g = svg.append("g");
    g.selectAll("path.bg").data(all.filter(f => neighbours.indexOf(f.properties.name) >= 0)).join("path")
      .attr("class", "country").attr("d", path);

    g.selectAll("path.hi").data(hi).join("path")
      .attr("class", f => "country hi " + NAMES[f.properties.name] + (NAMES[f.properties.name] === focus ? " on" : ""))
      .attr("d", path)
      .on("click", (e, f) => { e.stopPropagation(); closeInfo(); send(NAMES[f.properties.name]); })
      .append("title").text(f => f.properties.name);

    g.selectAll("text.nb").data(all.filter(f => neighbours.indexOf(f.properties.name) >= 0)).join("text")
      .attr("class", "clabel dim")
      .attr("transform", f => "translate(" + path.centroid(f) + ")")
      .text(f => f.properties.name.toUpperCase());

    const link = g.append("g");
    const cent = {};
    hi.forEach(f => { cent[NAMES[f.properties.name]] = path.centroid(f); });
    [["poland", "czechia"], ["czechia", "slovakia"], ["poland", "slovakia"]].forEach(([a, b]) => {
      if (!cent[a] || !cent[b]) return;
      link.append("line").attr("x1", cent[a][0]).attr("y1", cent[a][1]).attr("x2", cent[b][0]).attr("y2", cent[b][1])
        .attr("stroke", "rgba(70,80,64,.55)").attr("stroke-width", 1.4).attr("stroke-dasharray", "6 5");
    });
    Object.keys(cent).forEach(k => {
      link.append("circle").attr("cx", cent[k][0]).attr("cy", cent[k][1]).attr("r", 4.5)
        .attr("fill", "#fff").attr("stroke", "rgba(60,70,55,.7)").attr("stroke-width", 1.5);
    });

    hi.forEach(f => {
      const k = NAMES[f.properties.name], c = path.centroid(f);
      const nudge = k === "poland" ? [0, -46] : k === "czechia" ? [-34, -34] : [26, 34];
      g.append("text").attr("class", "clabel").attr("x", c[0] + nudge[0]).attr("y", c[1] + nudge[1]).text(LABELS[k]);
      (CITIES[k] || []).forEach(([name, lon, lat, cap, side], ci) => {
        const p = proj([lon, lat]);
        if (!p) return;
        const dot = g.append("circle").attr("class", "city" + (selected === name ? " sel" : ""))
          .attr("cx", p[0]).attr("cy", p[1]).attr("r", cap ? 4.5 : 3);
        dot.append("title").text(name);
        g.append("circle").attr("class", "cityhit").attr("cx", p[0]).attr("cy", p[1]).attr("r", 13)
          .on("mouseenter", function () { if (!pinned) showInfo(k, name, ci, dot.node()); })
          .on("mouseleave", function () { if (!pinned) closeInfo(); })
          .on("click", function (ev) { ev.stopPropagation(); pinned = true; showInfo(k, name, ci, dot.node()); })
          .append("title").text(name);
        const t = g.append("text").attr("class", "cityname" + (cap ? " cap" : "")).text(name);
        if (side === "l") t.attr("x", p[0] - 7).attr("y", p[1] + 3.5).attr("text-anchor", "end");
        else if (side === "u") t.attr("x", p[0]).attr("y", p[1] - 8).attr("text-anchor", "middle");
        else if (side === "d") t.attr("x", p[0]).attr("y", p[1] + 15).attr("text-anchor", "middle");
        else t.attr("x", p[0] + 7).attr("y", p[1] + 3.5);
      });
    });
  }

  draw();
  svg.on("click", () => closeInfo());
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeInfo(); });
  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 140); });
}).catch(() => {
  svg.append("text").attr("x", 24).attr("y", 40).attr("fill", "#5a6152").style("font-size", "14px").text("Map data unavailable offline.");
});
</script>
</body>
</html>
